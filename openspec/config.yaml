schema: spec-driven
project: id-night-landing
persistence: hybrid
strict_tdd: true

context: |
  Tech stack: Next.js 16.2.9 App Router, React 19.2.4, TypeScript 5, Tailwind CSS 4.
  Architecture: app/ routes compose shared components/ with mixed server/client React components.
  Testing: node:test (via tsx loader) runs tests/seo.test.ts, covering metadata/SEO/JSON-LD contracts
    and static-rendered copy/anchors (react-dom/server). No jsdom/testing-library/visual-regression
    runner exists, so pure visual asset swaps (icons, logos, styling) are not automatically testable.
  Style: Tailwind utilities, @/* path alias, metadata in app/layout.tsx.
  Convention: Read relevant Next.js 16 docs in node_modules/next/dist/docs/ before code changes.

testing:
  detected: 2026-07-28
  runner:
    available: true
    framework: "node:test (built-in) via tsx loader"
    command: "npm test"
  layers:
    unit: true
    integration: false
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: true
      command: npm run lint
    typechecker:
      available: true
      command: npx tsc --noEmit
    formatter:
      available: false
      command: ""

rules:
  proposal:
    - Include rollback plan for risky changes
    - Call out UX, SEO, or content impact for landing-page changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHOULD, MAY)
  design:
    - Document client/server component boundaries when relevant
    - Note animation and rendering tradeoffs for interactive sections
  tasks:
    - Group by phase and keep tasks completable in one session
  apply:
    - Read relevant Next.js 16 docs in node_modules/next/dist/docs/ before implementing
    - Follow existing App Router and shared component patterns
    - Strict TDD applies to testable surfaces (metadata/SEO/JSON-LD, static-rendered copy and
      anchors in tests/seo.test.ts) — extend or write a failing node:test case before implementing,
      then make it pass, then refactor.
    - Pure visual/presentational changes (icon or logo swaps, styling-only tweaks) have no
      automated test harness; verify manually and note this limitation instead of claiming
      test coverage that does not exist.
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: npm run build
    lint_command: npm run lint
    typecheck_command: npx tsc --noEmit
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
